project:
  name: ActiveRetina
  version: paper_v1_feasibility_A0_A2_TEST_FIXTURE
  created: 2026-10-01
  status: TEST_FIXTURE_ONLY_NOT_REAL_METRICS

dataset:
  name: MFIDDR_TEST_FIXTURE
  root: data/MFIDDR_TEST_FIXTURE
  train_images: train
  test_images: test
  train_csv: train_fourpic_label.csv
  test_csv: test_fourpic_label.csv
  manifest_output: results/TEST_FIXTURE_mfiddr_canonical_manifest.csv
  status_output: results/TEST_FIXTURE_A0_access_schema_status.json
  official_source: https://github.com/mfiddr/MFIDDR
  access_note: Public sample only; not valid for paper claims.
  fields:
    F1: macula_centered
    F2: optic_disc_centered
    F3: superior_tangent_to_optic_disc_horizontal_line
    F4: inferior_tangent_to_optic_disc_horizontal_line
  field_order: [F1, F2, F3, F4]
  filename_field_codes:
    right:
      "01": F1
      "02": F2
      "03": F3
      "04": F4
    left:
      "05": F1
      "06": F2
      "07": F3
      "08": F4
  expected_grades: [0, 1, 2, 3, 4]
  allow_incomplete_grade_set: true
  referable_threshold: 2

splits:
  unit: patient_id
  preserve_official_train_test: true
  validation_fraction_within_train: 0.15
  seed: 20261001
  immutable_output: results/TEST_FIXTURE_splits_manifest.json

model:
  image_encoder:
    family: timm
    candidate: convnext_tiny.fb_in22k_ft_in1k
    fallback: resnet50
    pretrained: true
    image_size: 512
  subset_classifier:
    type: permutation_aware_set_pooling
    pooling: mean_plus_max_plus_missing_mask
    hidden_dim: 512
    dropout: 0.20
  training:
    optimizer: adamw
    learning_rate: 0.0001
    batch_size: 16
    max_epochs: 20
    early_stopping_patience: 4
    class_weighting: balanced

evaluation:
  output: results/TEST_FIXTURE_A1_A2_metrics.json
  fixed_first_field: F1
  subset_budgets: [1, 2, 3, 4]
  bootstrap:
    n: 200
    seed: 20261001
    unit: patient_id
  primary_metrics:
    - auroc
  secondary_metrics:
    - macro_f1
  decision_thresholds:
    min_four_view_minus_best_one_view_auroc: 0.02
    min_patient_oracle_minus_best_fixed_same_budget_auroc: 0.015
    min_nonmyopic_minus_greedy_expected_utility: 0.01
